[package]
name = "nirushare"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Private Tailscale sharing for the NIRUX X11 desktop"

[dependencies]
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "2", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
